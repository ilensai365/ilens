<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="AI Content System cover">
  <title>AI Content System</title>
  <defs>
    <filter id="grain1"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine1" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#16140F" stop-opacity="0"/>
      <stop offset="1" stop-color="#16140F" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#F5F1E8"/>

  <circle cx="252" cy="332" r="72" fill="none" stroke="#16140F" stroke-opacity="0.12" stroke-width="1"/>
  <circle cx="222" cy="300" r="46" fill="none" stroke="#A9967F" stroke-opacity="0.4" stroke-width="1"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#16140F">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.55" text-anchor="end">DIGITAL SYSTEM</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.55" text-anchor="end">01</text>

    <text x="26" y="176" font-size="38" fill="#16140F">AI</text>
    <text x="26" y="224" font-size="38" fill="#16140F">Content</text>
    <text x="26" y="272" font-size="38" fill="#16140F">System</text>

    <text x="28" y="404" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.6">PLAN / CREATE / SCALE</text>

    <text x="292" y="404" font-size="11" font-style="italic" fill="#16140F" fill-opacity="0.75" text-anchor="end">A smarter</text>
    <text x="292" y="420" font-size="11" font-style="italic" fill="#16140F" fill-opacity="0.75" text-anchor="end">way to create.</text>
  </g>

  <g stroke="#16140F" stroke-opacity="0.1">
    <line x1="311" y1="14" x2="311" y2="446"/>
    <line x1="314" y1="18" x2="314" y2="442"/>
    <line x1="317" y1="22" x2="317" y2="438"/>
  </g>

  <rect width="320" height="460" filter="url(#grain1)" opacity="0.035"/>
  <rect width="320" height="460" fill="url(#spine1)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.25"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#16140F" stroke-opacity="0.08"/>
</svg>
