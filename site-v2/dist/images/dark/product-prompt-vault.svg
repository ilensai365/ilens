<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Prompt Vault cover">
  <title>The Prompt Vault</title>
  <defs>
    <filter id="grain10"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine10" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#1B1914"/>

  <!-- a prompt box with a blinking cursor -->
  <g transform="translate(160 290)">
    <rect x="0" y="0" width="128" height="104" rx="3" fill="none" stroke="#F5F1E8" stroke-opacity="0.22"/>
    <line x1="0" y1="20" x2="128" y2="20" stroke="#F5F1E8" stroke-opacity="0.14"/>
    <circle cx="10" cy="10" r="2.2" fill="#D4FF4F" fill-opacity="0.7"/>
    <circle cx="19" cy="10" r="2.2" fill="#F5F1E8" fill-opacity="0.25"/>
    <circle cx="28" cy="10" r="2.2" fill="#F5F1E8" fill-opacity="0.25"/>
    <g font-family="'Courier New', monospace" font-size="8.5" fill="#F5F1E8" fill-opacity="0.55">
      <text x="10" y="40">Write 5 hooks</text>
      <text x="10" y="53">for [product],</text>
      <text x="10" y="66">in my voice —</text>
    </g>
    <rect x="10" y="74" width="6" height="11" fill="#D4FF4F"/>
  </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#F5F1E8">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6" text-anchor="end">PROMPTS</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6" text-anchor="end">09</text>

    <text x="26" y="152" font-size="34" fill="#F5F1E8">The</text>
    <text x="26" y="194" font-size="34" fill="#F5F1E8">Prompt</text>
    <text x="26" y="236" font-size="34" fill="#F5F1E8">Vault</text>

    <text x="28" y="266" font-size="9.5" letter-spacing="1.4" fill="#F5F1E8" fill-opacity="0.6">HOOKS — CAPTIONS — SALES COPY</text>

    <text x="28" y="404" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.8">Words that</text>
    <text x="28" y="420" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.8">actually work.</text>

    <text x="160" y="442" font-size="7" letter-spacing="2" fill="#F5F1E8" fill-opacity="0.4" text-anchor="middle">ILENS.STUDIO — DIGITAL EDITION</text>
  </g>

  <g stroke="#F5F1E8" stroke-opacity="0.14">
    <line x1="311" y1="14" x2="311" y2="446"/>
    <line x1="314" y1="18" x2="314" y2="442"/>
    <line x1="317" y1="22" x2="317" y2="438"/>
  </g>

  <rect width="320" height="460" filter="url(#grain10)" opacity="0.05"/>
  <rect width="320" height="460" fill="url(#spine10)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.08"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#F5F1E8" stroke-opacity="0.1"/>
</svg>
