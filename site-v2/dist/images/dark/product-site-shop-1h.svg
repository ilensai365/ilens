<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The 60-Minute Storefront cover">
  <title>The 60-Minute Storefront</title>
  <defs>
    <filter id="grain5"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine5" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#1B1914"/>

  <g stroke="#F5F1E8" stroke-opacity="0.1" stroke-width="1">
    <line x1="176" y1="256" x2="176" y2="412"/>
    <line x1="202" y1="256" x2="202" y2="412"/>
    <line x1="228" y1="256" x2="228" y2="412"/>
    <line x1="254" y1="256" x2="254" y2="412"/>
    <line x1="280" y1="256" x2="280" y2="412"/>
    <line x1="176" y1="256" x2="280" y2="256"/>
    <line x1="176" y1="282" x2="280" y2="282"/>
    <line x1="176" y1="308" x2="280" y2="308"/>
    <line x1="176" y1="334" x2="280" y2="334"/>
    <line x1="176" y1="360" x2="280" y2="360"/>
    <line x1="176" y1="386" x2="280" y2="386"/>
    <line x1="176" y1="412" x2="280" y2="412"/>
  </g>
  <circle cx="228" cy="308" r="3" fill="#E2B464" fill-opacity="0.85"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#F5F1E8">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6" text-anchor="end">PLAYBOOK</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6" text-anchor="end">05</text>

    <text x="26" y="152" font-size="34" fill="#F5F1E8">The</text>
    <text x="26" y="194" font-size="34" fill="#F5F1E8">60-Minute</text>
    <text x="26" y="236" font-size="34" fill="#F5F1E8">Storefront</text>

    <text x="28" y="266" font-size="9.5" letter-spacing="1.4" fill="#F5F1E8" fill-opacity="0.6">IDEA — SITE — SHOP — LIVE</text>

    <text x="28" y="404" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.8">Before your coffee</text>
    <text x="28" y="420" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.8">gets cold.</text>

    <text x="160" y="442" font-size="7" letter-spacing="2" fill="#F5F1E8" fill-opacity="0.4" text-anchor="middle">ILENS.STUDIO — DIGITAL EDITION</text>
  </g>

  <g stroke="#F5F1E8" stroke-opacity="0.14">
    <line x1="311" y1="14" x2="311" y2="446"/>
    <line x1="314" y1="18" x2="314" y2="442"/>
    <line x1="317" y1="22" x2="317" y2="438"/>
  </g>

  <rect width="320" height="460" filter="url(#grain5)" opacity="0.05"/>
  <rect width="320" height="460" fill="url(#spine5)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.08"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#F5F1E8" stroke-opacity="0.1"/>
</svg>
