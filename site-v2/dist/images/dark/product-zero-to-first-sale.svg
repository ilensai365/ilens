<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Zero to First Sale cover">
  <title>Zero to First Sale</title>
  <defs>
    <filter id="grain7"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine7" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#F5F1E8" stop-opacity="0"/>
      <stop offset="1" stop-color="#F5F1E8" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#1B1914"/>

  <rect x="196" y="252" width="108" height="82" fill="none" stroke="#F5F1E8" stroke-opacity="0.14" stroke-width="1"/>
  <rect x="170" y="284" width="128" height="82" fill="none" stroke="#D4FF4F" stroke-opacity="0.4" stroke-width="1"/>
  <rect x="144" y="316" width="128" height="82" fill="none" stroke="#F5F1E8" stroke-opacity="0.2" stroke-width="1"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#F5F1E8">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.55" text-anchor="end">BLUEPRINT</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.55" text-anchor="end">07</text>

    <text x="26" y="152" font-size="34" fill="#F5F1E8">Zero to</text>
    <text x="26" y="194" font-size="34" fill="#F5F1E8">First</text>
    <text x="26" y="236" font-size="34" fill="#F5F1E8">Sale</text>

    <text x="28" y="266" font-size="9.5" letter-spacing="1.4" fill="#F5F1E8" fill-opacity="0.6">SITE — PRODUCT — PAYMENT</text>

    <text x="28" y="404" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.75">One evening.</text>
    <text x="28" y="420" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.75">One system.</text>

    <text x="160" y="442" font-size="7" letter-spacing="2" fill="#F5F1E8" fill-opacity="0.4" text-anchor="middle">ILENS.STUDIO — DIGITAL EDITION</text>
  </g>

  <g stroke="#F5F1E8" stroke-opacity="0.1">
    <line x1="311" y1="14" x2="311" y2="446"/>
    <line x1="314" y1="18" x2="314" y2="442"/>
    <line x1="317" y1="22" x2="317" y2="438"/>
  </g>

  <rect width="320" height="460" filter="url(#grain7)" opacity="0.035"/>
  <rect width="320" height="460" fill="url(#spine7)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.25"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#F5F1E8" stroke-opacity="0.08"/>
</svg>
