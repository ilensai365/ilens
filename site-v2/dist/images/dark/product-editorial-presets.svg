<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Editorial Presets cover">
  <title>Editorial Presets</title>
  <defs>
    <filter id="grain11"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine11" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#F5F1E8" stop-opacity="0"/>
      <stop offset="1" stop-color="#F5F1E8" stop-opacity="0.14"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#1B1914"/>

  <!-- editing sliders: the "one tap" look -->
  <g transform="translate(100 282)" stroke="#F5F1E8">
    <line x1="0" y1="0" x2="184" y2="0" stroke-opacity="0.25"/>
    <line x1="0" y1="32" x2="184" y2="32" stroke-opacity="0.25"/>
    <line x1="0" y1="64" x2="184" y2="64" stroke-opacity="0.25"/>
    <line x1="0" y1="96" x2="184" y2="96" stroke-opacity="0.25"/>
    <line x1="0" y1="0" x2="120" y2="0" stroke-opacity="0.8"/>
    <line x1="0" y1="32" x2="64" y2="32" stroke-opacity="0.8"/>
    <line x1="0" y1="64" x2="150" y2="64" stroke-opacity="0.8"/>
    <line x1="0" y1="96" x2="94" y2="96" stroke-opacity="0.8"/>
    <circle cx="120" cy="0" r="5" fill="#D4FF4F" stroke-opacity="0.8"/>
    <circle cx="64" cy="32" r="5" fill="#D4FF4F" stroke="none"/>
    <circle cx="150" cy="64" r="5" fill="#D4FF4F" stroke-opacity="0.8"/>
    <circle cx="94" cy="96" r="5" fill="#F5F1E8" stroke="none"/>
  </g>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#F5F1E8">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.55" text-anchor="end">PRESETS</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.55" text-anchor="end">10</text>

    <text x="26" y="152" font-size="34" fill="#F5F1E8">Editorial</text>
    <text x="26" y="194" font-size="34" fill="#F5F1E8">Presets</text>

    <text x="28" y="224" font-size="9.5" letter-spacing="1.4" fill="#F5F1E8" fill-opacity="0.6">WARM — CLEAN — TIMELESS</text>

    <g font-size="7" letter-spacing="1.2" fill="#F5F1E8" fill-opacity="0.5">
      <text x="28" y="285">TONE</text>
      <text x="28" y="317">GRAIN</text>
      <text x="28" y="349">WARMTH</text>
      <text x="28" y="381">CONTRAST</text>
    </g>

    <text x="28" y="412" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.75">One tap. One look.</text>

    <text x="160" y="442" font-size="7" letter-spacing="2" fill="#F5F1E8" fill-opacity="0.4" text-anchor="middle">ILENS.STUDIO — DIGITAL EDITION</text>
  </g>

  <g stroke="#F5F1E8" stroke-opacity="0.1">
    <line x1="311" y1="14" x2="311" y2="446"/>
    <line x1="314" y1="18" x2="314" y2="442"/>
    <line x1="317" y1="22" x2="317" y2="438"/>
  </g>

  <rect width="320" height="460" filter="url(#grain11)" opacity="0.035"/>
  <rect width="320" height="460" fill="url(#spine11)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.25"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#F5F1E8" stroke-opacity="0.08"/>
</svg>
