<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Creative Strategy Workbook cover">
  <title>Creative Strategy Workbook</title>
  <defs>
    <filter id="grain4"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine4" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#16140F" stop-opacity="0"/>
      <stop offset="1" stop-color="#16140F" stop-opacity="0.14"/>
    </linearGradient>
    <linearGradient id="wave4" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#C9BBA5" stop-opacity="0.55"/>
      <stop offset="1" stop-color="#F5F1E8" stop-opacity="0.15"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#FAF7F0"/>

  <path d="M 320,150 C 250,195 245,270 300,315 C 345,352 315,410 265,460 L 320,460 Z" fill="url(#wave4)"/>
  <path d="M 320,150 C 250,195 245,270 300,315 C 345,352 315,410 265,460" fill="none" stroke="#A9967F" stroke-opacity="0.4" stroke-width="1"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#16140F">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.55" text-anchor="end">WORKBOOK</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.55" text-anchor="end">04</text>

    <text x="26" y="152" font-size="32" fill="#16140F">Creative</text>
    <text x="26" y="194" font-size="32" fill="#16140F">Strategy</text>
    <text x="26" y="236" font-size="32" fill="#16140F">Workbook</text>

    <text x="28" y="266" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">IDEAS</text>
    <text x="28" y="282" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">PLANNING</text>
    <text x="28" y="298" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">EXECUTION</text>
    <text x="28" y="314" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">GROWTH</text>

    <text x="28" y="404" font-size="11" font-style="italic" fill="#16140F" fill-opacity="0.75">Turn ideas</text>
    <text x="28" y="420" font-size="11" font-style="italic" fill="#16140F" fill-opacity="0.75">into direction.</text>

    <text x="160" y="444" font-size="7" letter-spacing="2" fill="#16140F" fill-opacity="0.4" text-anchor="middle">ILENS.STUDIO — DIGITAL EDITION</text>
  </g>

  <rect width="320" height="460" filter="url(#grain4)" opacity="0.035"/>
  <rect width="320" height="460" fill="url(#spine4)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.3"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#16140F" stroke-opacity="0.08"/>
</svg>
