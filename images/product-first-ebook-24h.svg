<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The 24-Hour Ebook cover">
  <title>The 24-Hour Ebook</title>
  <defs>
    <filter id="grain6"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spine6" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#16140F" stop-opacity="0"/>
      <stop offset="1" stop-color="#16140F" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#C9BBA5"/>

  <circle cx="236" cy="332" r="70" fill="none" stroke="#16140F" stroke-opacity="0.16" stroke-width="1"/>
  <g stroke="#16140F" stroke-opacity="0.24" stroke-width="1.2">
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(0 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(30 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(60 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(90 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(120 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(150 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(180 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(210 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(240 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(270 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(300 236 332)"/>
    <line x1="236" y1="254" x2="236" y2="266" transform="rotate(330 236 332)"/>
  </g>
  <line x1="236" y1="332" x2="236" y2="285" stroke="#16140F" stroke-opacity="0.4" stroke-width="1.5"/>
  <line x1="236" y1="332" x2="268" y2="332" stroke="#16140F" stroke-opacity="0.4" stroke-width="1.5"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="28" y="52" font-size="21" font-weight="700" fill="#16140F">iLens</text>

    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.55" text-anchor="end">SPRINT</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#16140F" fill-opacity="0.55" text-anchor="end">06</text>

    <text x="26" y="152" font-size="34" fill="#16140F">The</text>
    <text x="26" y="194" font-size="34" fill="#16140F">24-Hour</text>
    <text x="26" y="236" font-size="34" fill="#16140F">Ebook</text>

    <text x="28" y="266" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">WRITE</text>
    <text x="28" y="282" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">PUBLISH</text>
    <text x="28" y="298" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">SELL</text>
    <text x="28" y="314" font-size="9" letter-spacing="1.3" fill="#16140F" fill-opacity="0.55">REPEAT</text>

    <text x="28" y="404" font-size="11" font-style="italic" fill="#16140F" fill-opacity="0.75">Before you talk</text>
    <text x="28" y="420" font-size="11" font-style="italic" fill="#16140F" fill-opacity="0.75">yourself out of it.</text>

    <text x="160" y="442" font-size="7" letter-spacing="2" fill="#16140F" fill-opacity="0.45" text-anchor="middle">ILENS.STUDIO — DIGITAL EDITION</text>
  </g>

  <g stroke="#16140F" stroke-opacity="0.12">
    <line x1="311" y1="14" x2="311" y2="446"/>
    <line x1="314" y1="18" x2="314" y2="442"/>
    <line x1="317" y1="22" x2="317" y2="438"/>
  </g>

  <rect width="320" height="460" filter="url(#grain6)" opacity="0.04"/>
  <rect width="320" height="460" fill="url(#spine6)"/>
  <rect width="320" height="2" fill="#FFFFFF" opacity="0.3"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#16140F" stroke-opacity="0.1"/>
</svg>
