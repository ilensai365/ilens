    <linearGradient id="spine2" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0.94" stop-color="#16140F" stop-opacity="0"/>
      <stop offset="1" stop-color="#16140F" stop-opacity="0.16"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#C9BBA5"/>

