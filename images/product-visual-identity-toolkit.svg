      <stop offset="0.94" stop-color="#000000" stop-opacity="0"/>
      <stop offset="1" stop-color="#000000" stop-opacity="0.35"/>
    </linearGradient>
  </defs>

  <rect width="320" height="460" fill="#16140F"/>

  <circle cx="232" cy="330" r="66" fill="none" stroke="#F5F1E8" stroke-opacity="0.18" stroke-width="1"/>
  <line x1="272" y1="216" x2="272" y2="424" stroke="#C9BBA5" stroke-opacity="0.35" stroke-width="1"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
