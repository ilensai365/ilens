    <text x="292" y="46" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6" text-anchor="end">TEMPLATE SET</text>
    <text x="292" y="58" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6" text-anchor="end">03</text>

