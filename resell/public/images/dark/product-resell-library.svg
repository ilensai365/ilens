<svg viewBox="0 0 320 460" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="The Resell Library cover">
  <title>The Resell Library</title>
  <defs>
    <filter id="grainR"><feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="2" stitchTiles="stitch" result="n"/><feColorMatrix in="n" type="saturate" values="0"/></filter>
    <linearGradient id="spineR" x1="0" y1="0" x2="1" y2="0"><stop offset="0.94" stop-color="#F5F1E8" stop-opacity="0"/><stop offset="1" stop-color="#F5F1E8" stop-opacity="0.2"/></linearGradient>
  </defs>
  <rect width="320" height="460" fill="#12110E"/>
  <rect x="18" y="18" width="284" height="424" fill="none" stroke="#E2B464" stroke-opacity="0.35"/>

  <g font-family="Georgia, 'Iowan Old Style', 'Times New Roman', serif">
    <text x="34" y="56" font-size="21" font-weight="700" fill="#F5F1E8">iLens</text>
    <text x="286" y="50" font-size="9" letter-spacing="1.5" fill="#E2B464" text-anchor="end">PLR LIBRARY</text>
    <text x="286" y="62" font-size="9" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.65" text-anchor="end">4 EBOOKS</text>

    <g font-size="8" letter-spacing="1.5" fill="#F5F1E8" fill-opacity="0.6">
      <text x="34" y="118">01</text><text x="34" y="184">02</text><text x="34" y="250">03</text>
    </g>
    <g font-size="48" fill="#F5F1E8">
      <text x="54" y="142">Rebrand.</text>
      <text x="54" y="208">Resell.</text>
      <text x="54" y="274" fill="#E2B464" font-style="italic">Profit.</text>
    </g>

    <line x1="34" y1="302" x2="286" y2="302" stroke="#E2B464" stroke-opacity="0.45"/>
    <g font-size="7.5" letter-spacing="1.2" fill="#F5F1E8" fill-opacity="0.75">
      <text x="34" y="324">AI CONTENT SYSTEM</text><text x="286" y="324" text-anchor="end">THE 60-MINUTE STOREFRONT</text>
      <text x="34" y="342">THE 24-HOUR EBOOK</text><text x="286" y="342" text-anchor="end">ZERO TO FIRST SALE</text>
    </g>

    <text x="34" y="398" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.85">The Resell Library —</text>
    <text x="34" y="414" font-size="11" font-style="italic" fill="#F5F1E8" fill-opacity="0.85">yours to put your name on.</text>
    <text x="160" y="434" font-size="7" letter-spacing="2" fill="#F5F1E8" fill-opacity="0.45" text-anchor="middle">RESELL.ILENS.CO — PRIVATE LABEL RIGHTS</text>
  </g>

  <g stroke="#F5F1E8" stroke-opacity="0.12">
    <line x1="311" y1="14" x2="311" y2="446"/><line x1="314" y1="18" x2="314" y2="442"/><line x1="317" y1="22" x2="317" y2="438"/>
  </g>
  <rect width="320" height="460" filter="url(#grainR)" opacity="0.05"/>
  <rect width="320" height="460" fill="url(#spineR)"/>
  <rect x="0.5" y="0.5" width="319" height="459" fill="none" stroke="#F5F1E8" stroke-opacity="0.1"/>
</svg>
